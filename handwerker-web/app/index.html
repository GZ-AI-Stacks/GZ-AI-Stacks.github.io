<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GZ Handwerker-Web — Website-Konfigurator</title>
<style>
:root{
  --bg:#0a0e14; --panel:#0f1620; --panel2:#131c28; --line:#1e2b3a;
  --txt:#e6f0f7; --muted:#8aa0b4; --accent:#00FFAA; --accent2:#00B4FF;
  --pink:#FF0080; --purple:#8C00FF; --warn:#ffcc44; --err:#ff5577;
  --radius:14px; --shadow:0 8px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg);color:var(--txt);
  font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
  line-height:1.5;overflow:hidden;
}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit}

/* ---------- Matrix-Rain (nur Konfigurator-UI) ---------- */
#matrix{position:fixed;inset:0;z-index:0;opacity:.12;pointer-events:none}

/* ---------- LIZENZ-GATE ---------- */
#gate{
  position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 30%,#0d1622,#060a10);
}
.gate-card{
  width:min(460px,92vw);background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);padding:34px 30px;box-shadow:var(--shadow);text-align:center;
}
.gate-logo{font-size:28px;font-weight:800;letter-spacing:.5px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:6px}
.gate-sub{color:var(--muted);font-size:14px;margin-bottom:24px}
.gate-card label{display:block;text-align:left;font-size:13px;color:var(--muted);margin:0 0 6px}
#licenseInput{
  width:100%;padding:13px 14px;background:#0a121c;border:1px solid var(--line);
  border-radius:10px;color:var(--txt);font-size:14px;letter-spacing:.5px;
  text-align:center;font-family:"Consolas",monospace;
}
#licenseInput:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,255,170,.15)}
.gate-btn{
  width:100%;margin-top:16px;padding:13px;border:none;border-radius:10px;font-size:15px;font-weight:700;
  background:linear-gradient(90deg,var(--accent),var(--accent2));color:#04111a;
  transition:transform .12s,box-shadow .12s;
}
.gate-btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(0,255,170,.3)}
.gate-btn:disabled{opacity:.55;cursor:wait;transform:none;box-shadow:none}
.gate-msg{min-height:20px;margin-top:14px;font-size:13px}
.gate-msg.err{color:var(--err)}
.gate-msg.ok{color:var(--accent)}
.gate-foot{margin-top:22px;font-size:11px;color:#5a6c7d;line-height:1.6}
.gate-foot a{color:var(--accent2);text-decoration:none}

/* ---------- APP-LAYOUT ---------- */
#app{position:relative;z-index:1;height:100vh;display:none;grid-template-columns:380px 1fr;grid-template-rows:56px 1fr}
.topbar{
  grid-column:1/3;display:flex;align-items:center;gap:14px;padding:0 18px;
  background:var(--panel);border-bottom:1px solid var(--line);
}
.topbar .brand{font-weight:800;background:linear-gradient(90deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;background-clip:text;color:transparent;font-size:16px}
.topbar .lic{font-size:11px;color:var(--muted);border:1px solid var(--line);padding:3px 9px;border-radius:20px}
.topbar .spacer{flex:1}
.tb-btn{padding:8px 14px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);
  border-radius:9px;font-size:13px;font-weight:600;transition:.12s}
.tb-btn:hover{border-color:var(--accent);color:var(--accent)}
.tb-btn.primary{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#04111a;border:none}
.tb-btn.primary:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(0,255,170,.25);color:#04111a}

/* ---------- KONFIGURATOR (links) ---------- */
.config{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:14px}
.config::-webkit-scrollbar{width:9px}
.config::-webkit-scrollbar-thumb{background:#22303f;border-radius:8px}
.sec{border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden;background:var(--panel2)}
.sec > summary{
  list-style:none;cursor:pointer;padding:12px 14px;font-weight:700;font-size:13px;
  display:flex;align-items:center;gap:9px;-webkit-user-select:none;user-select:none;
}
.sec > summary::-webkit-details-marker{display:none}
.sec > summary::before{content:"▸";color:var(--accent);transition:.15s;font-size:11px}
.sec[open] > summary::before{transform:rotate(90deg)}
.sec .body{padding:4px 14px 16px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.field input[type=text],.field input[type=tel],.field input[type=email],
.field input[type=url],.field textarea,.field select{
  width:100%;padding:9px 11px;background:#0a121c;border:1px solid var(--line);
  border-radius:8px;color:var(--txt);font-size:13px;
}
.field input:focus,.field textarea:focus,.field select:focus{
  outline:none;border-color:var(--accent2);box-shadow:0 0 0 2px rgba(0,180,255,.15)
}
.field textarea{resize:vertical;min-height:60px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.color-presets{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.swatch{width:30px;height:30px;border-radius:8px;border:2px solid transparent;cursor:pointer}
.swatch.active{border-color:#fff;box-shadow:0 0 0 2px var(--accent)}
.row3-color{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.row3-color > div{display:flex;flex-direction:column;gap:4px;align-items:center}
.row3-color .cpl{font-size:11px;color:var(--muted)}
.row3-color input[type=color]{width:100%;height:38px;padding:2px;background:#0a121c;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.oeff-tage{display:flex;flex-direction:column;gap:6px}
.oeff-tag{display:grid;grid-template-columns:1fr auto auto auto;align-items:center;gap:8px}
.oeff-tag .oeff-day{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--txt);cursor:pointer;margin:0}
.oeff-tag .oeff-day input{margin:0}
.oeff-tag input[type=time]{height:32px;background:#0a121c;border:1px solid var(--line);border-radius:7px;color:var(--txt);font-size:12px;padding:0 6px;font-family:inherit}
.oeff-tag input[type=time]:disabled{opacity:.4;cursor:not-allowed}
.oeff-tag .oeff-bis-sep{color:var(--muted);font-size:12px}
.grad4{display:flex;gap:6px;align-items:center}
.grad4 input[type=color]{flex:1;height:36px;padding:2px;background:#0a121c;border:1px solid var(--line);border-radius:8px;cursor:pointer;min-width:0}
.g4-wrap{flex:1;display:flex;gap:3px;align-items:center;min-width:0}
.g4-wrap input[type=color]{flex:1}
.g4-wrap .ci-reset{flex:0 0 auto;width:22px;height:36px}
.grad-presets{display:flex;gap:8px;flex-wrap:wrap}
.grad-presets button{flex:1 1 calc(33% - 6px);min-width:80px;height:30px;border:1px solid var(--line);border-radius:8px;cursor:pointer;
  color:#fff;font-size:11px;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.6);transition:.12s}
.grad-presets button:hover{transform:translateY(-1px);border-color:var(--accent)}
.bg-presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.bg-prev{position:relative;height:58px;border:1px solid var(--line);border-radius:9px;cursor:pointer;overflow:hidden;
  background-color:#0a121c;display:flex;align-items:flex-end;justify-content:center;padding:0;transition:.12s}
.bg-prev:hover{transform:translateY(-1px);border-color:var(--accent)}
.bg-prev.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.bg-prev span{width:100%;font-size:10px;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8);
  background:linear-gradient(transparent,rgba(0,0,0,.55));padding:3px 4px;text-align:center}
.bg-prev[aria-label]{}
.bereich-card{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:#0a121c}
.bereich-title{font-size:12px;font-weight:800;color:var(--txt);margin-bottom:8px;letter-spacing:.02em}
.bereich-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.bereich-grid > div{display:flex;flex-direction:column;gap:4px;align-items:center}
.bereich-grid .cpl{font-size:11px;color:var(--muted)}
.ci-wrap{display:flex;align-items:center;gap:3px;width:100%}
.ci-wrap input[type=color]{flex:1;height:34px;padding:2px;background:#0a121c;border:1px solid var(--line);border-radius:7px;cursor:pointer;min-width:0}
.ci-reset{flex:0 0 auto;width:24px;height:34px;border:1px solid var(--line);border-radius:7px;background:transparent;color:var(--muted);cursor:pointer;font-size:13px;line-height:1}
.ci-reset:hover{border-color:var(--accent);color:var(--accent)}
.bereich-cardstyle{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.bereich-cardstyle > summary{font-size:11px;font-weight:700;color:var(--muted);cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px}
.bereich-cardstyle > summary::before{content:"▸";font-size:9px}
.bereich-cardstyle[open] > summary::before{content:"▾"}
.bereich-cardstyle select{width:100%;height:32px;background:#0a121c;border:1px solid var(--line);border-radius:7px;color:var(--txt);font-size:12px;padding:0 6px;cursor:pointer;min-width:0}
.bereich-warn{display:none;margin-top:8px;font-size:11px;color:#f0b429;background:rgba(240,180,41,.08);border:1px solid rgba(240,180,41,.3);border-radius:7px;padding:6px 8px}
.hint{font-size:11px;color:#5a6c7d;margin-top:4px}
.list-item{border:1px solid var(--line);border-radius:9px;padding:10px;margin-bottom:9px;background:#0a121c;position:relative}
.list-item input[type=text],.list-item input[type=tel],.list-item input[type=email],
.list-item input[type=url],.list-item textarea,.list-item select{
  width:100%;max-width:100%;box-sizing:border-box;padding:9px 11px;background:#0a121c;
  border:1px solid var(--line);border-radius:8px;color:var(--txt);font-size:13px}
.list-item textarea{resize:vertical;min-height:54px;font-family:inherit}
.list-item .row2{min-width:0}.list-item .row2>div{min-width:0}
.list-item label{display:block;margin-bottom:4px}
.li-order{position:absolute;top:7px;right:30px;display:flex;gap:2px}
.li-order button{background:none;border:1px solid var(--line);color:var(--muted);width:20px;height:20px;border-radius:5px;font-size:10px;line-height:1;cursor:pointer;padding:0}
.li-order button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.li-order button:disabled{opacity:.3;cursor:default}
.add-btn{width:100%;padding:9px;border:1px dashed var(--accent2);background:transparent;color:var(--accent2);
  border-radius:8px;font-size:13px;font-weight:600}
.add-btn:hover{background:rgba(0,180,255,.08)}
.imgprev{max-width:100%;max-height:80px;border-radius:6px;margin-top:6px;display:none}
.disclaimer{font-size:11px;color:var(--warn);background:rgba(255,204,68,.08);
  border:1px solid rgba(255,204,68,.25);border-radius:8px;padding:9px 11px;margin-top:6px}

/* ---------- VORSCHAU (rechts) ---------- */
.preview-wrap{background:#1a2330;overflow:hidden;display:flex;flex-direction:column}
.preview-bar{height:38px;display:flex;align-items:center;gap:10px;padding:0 14px;
  background:var(--panel2);border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.preview-bar .dot{width:10px;height:10px;border-radius:50%}
.dot.r{background:#ff5f57}.dot.y{background:#febc2e}.dot.g{background:#28c840}
.preview-bar .url{flex:1;background:#0a121c;border-radius:6px;padding:4px 10px;color:var(--muted);font-size:11px}
.vp-btn{border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:6px;padding:3px 9px;font-size:11px}
.vp-btn.active{color:var(--accent);border-color:var(--accent)}
#previewFrame{flex:1;width:100%;border:none;background:#fff;transition:max-width .2s;margin:0 auto}

/* ---------- TOAST ---------- */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--panel);border:1px solid var(--accent);color:var(--txt);padding:12px 22px;
  border-radius:10px;z-index:2000;opacity:0;transition:.25s;box-shadow:var(--shadow);font-size:14px}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:900px){
  #app{grid-template-columns:1fr;grid-template-rows:56px auto 1fr}
  .config{border-right:none;border-bottom:1px solid var(--line);max-height:42vh}
  .preview-wrap{grid-column:1}
}
</style>
</head>
<body>

<canvas id="matrix" aria-hidden="true"></canvas>

<!-- ============ LIZENZ-GATE ============ -->
<div id="gate" role="dialog" aria-modal="true" aria-labelledby="gateTitle">
  <div class="gate-card">
    <div class="gate-logo" id="gateTitle">GZ Handwerker-Web</div>
    <div class="gate-sub">Website-Konfigurator · Lizenz aktivieren</div>
    <label for="licenseInput">Ihr Lizenzschlüssel</label>
    <input id="licenseInput" type="text" autocomplete="off" spellcheck="false"
           placeholder="GZWEB-PRO-XXXXXXXX-..." aria-describedby="gateMsg">
    <button type="button" class="gate-btn" id="gateBtn">Aktivieren</button>
    <div class="gate-msg" id="gateMsg" role="status" aria-live="polite"></div>
    <div class="gate-foot">
      Ihren Schlüssel haben Sie nach dem Kauf per E-Mail erhalten.<br>
      Gerd Zimmermann GZ-AI.-Stacks · <a href="https://www.gz-ai-stacks.de" target="_blank" rel="noopener">www.gz-ai-stacks.de</a>
    </div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app">
  <div class="topbar">
    <span class="brand">GZ Handwerker-Web</span>
    <span class="lic" id="licBadge">—</span>
    <span class="spacer"></span>
    <button type="button" class="tb-btn" id="btnSaveCfg" title="Konfiguration als Datei sichern">Konfiguration sichern</button>
    <button type="button" class="tb-btn" id="btnLoadCfg" title="Konfiguration laden">Laden</button>
    <button type="button" class="tb-btn" id="btnLicReset" title="Andere Lizenz eingeben (aktuelle wird abgemeldet)">Lizenz wechseln</button>
    <button type="button" class="tb-btn primary" id="btnExport" title="Fertige Website exportieren">Website exportieren</button>
  </div>

  <!-- KONFIGURATOR -->
  <div class="config" id="config"></div>

  <!-- VORSCHAU -->
  <div class="preview-wrap">
    <div class="preview-bar">
      <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
      <span class="url" id="previewUrl">www.ihre-firma.de</span>
      <button type="button" class="vp-btn active" data-vp="desktop">Desktop</button>
      <button type="button" class="vp-btn" data-vp="mobile">Mobil</button>
    </div>
    <iframe id="previewFrame" title="Website-Vorschau" sandbox="allow-scripts allow-same-origin allow-popups"></iframe>
  </div>
</div>

<input type="file" id="fileLoadCfg" accept=".json" style="display:none">
<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";

/* =========================================================
   1) LIZENZ — Ed25519 Verify im Browser (Web Crypto API)
   =========================================================
   Public Key als JWK. Gehört zum Privatschlüssel im Vendor-Ordner
   (_VENDOR_NICHT_AUSLIEFERN/LICENSE-PRIVATE.key). Aktualisieren via:
     node license-gen.js --pubjwk  */
const LICENSE_PUBLIC_JWK = {"crv":"Ed25519","x":"ti7emjBwXlq-t0WaO6MBXc0OZICiajESZX8vNksZnK4","kty":"OKP"};

const PRODUCT_PREFIX = "GZWEB";
const ALPHABET = "0123456789ABCDEFGHJKMNPQRSTVWXYZ"; // Crockford Base32

function base32decode(str){
  let bits=0,value=0;const out=[];
  for(const ch of str.toUpperCase()){
    const idx=ALPHABET.indexOf(ch);
    if(idx<0) continue;
    value=(value<<5)|idx; bits+=5;
    if(bits>=8){ out.push((value>>>(bits-8))&0xff); bits-=8; }
  }
  return new Uint8Array(out);
}

/* Key-Format: GZWEB-<ED>-<SERIAL>-<SIG-GRUPPEN...>
   Signatur deckt den Payload "GZWEB-<ED>-<SERIAL>" ab. */
function parseLicense(raw){
  const clean = raw.trim().toUpperCase().replace(/\s+/g,"");
  const parts = clean.split("-");
  if(parts.length < 4) return null;
  if(parts[0] !== PRODUCT_PREFIX) return null;
  const editionCode = parts[1];
  const serial = parts[2];
  const sigB32 = parts.slice(3).join("");
  const payload = `${PRODUCT_PREFIX}-${editionCode}-${serial}`;
  return { editionCode, serial, sigB32, payload, clean };
}

const EDITION_NAMES = { BAS:"Basis", PRO:"Pro", MAS:"Master" };

async function verifyLicense(raw){
  const p = parseLicense(raw);
  if(!p) return { ok:false, reason:"Format ungültig." };
  if(!EDITION_NAMES[p.editionCode]) return { ok:false, reason:"Unbekannte Edition." };
  let sig;
  try { sig = base32decode(p.sigB32); } catch(e){ return { ok:false, reason:"Signatur unlesbar." }; }
  if(sig.length !== 64) return { ok:false, reason:"Signaturlänge ungültig." };
  try{
    const key = await crypto.subtle.importKey("jwk", LICENSE_PUBLIC_JWK, {name:"Ed25519"}, false, ["verify"]);
    const data = new TextEncoder().encode(p.payload);
    const valid = await crypto.subtle.verify({name:"Ed25519"}, key, sig, data);
    if(!valid) return { ok:false, reason:"Schlüssel ungültig oder gefälscht." };
    return { ok:true, edition:p.editionCode, editionName:EDITION_NAMES[p.editionCode], serial:p.serial, key:p.clean };
  }catch(e){
    return { ok:false, reason:"Krypto-Fehler: "+e.message };
  }
}

const LS_LICENSE = "gzweb_license";

async function tryUnlock(raw, fromStorage){
  const res = await verifyLicense(raw);
  const msg = document.getElementById("gateMsg");
  if(res.ok){
    localStorage.setItem(LS_LICENSE, res.key);
    document.getElementById("licBadge").textContent = "Lizenz: " + res.editionName + " · " + res.serial;
    document.getElementById("gate").style.display="none";
    document.getElementById("app").style.display="grid";
    initApp();
    return true;
  } else {
    if(!fromStorage){
      msg.className="gate-msg err";
      msg.textContent = "✗ " + res.reason;
    }
    localStorage.removeItem(LS_LICENSE);
    return false;
  }
}

window.addEventListener("DOMContentLoaded", async ()=>{
  startMatrix();
  const btn = document.getElementById("gateBtn");
  const inp = document.getElementById("licenseInput");
  btn.addEventListener("click", async ()=>{
    btn.disabled=true; btn.textContent="Prüfe...";
    await tryUnlock(inp.value, false);
    btn.disabled=false; btn.textContent="Aktivieren";
  });
  inp.addEventListener("keydown", e=>{ if(e.key==="Enter") btn.click(); });
  // Auto-Unlock falls schon aktiviert
  const saved = localStorage.getItem(LS_LICENSE);
  if(saved){ await tryUnlock(saved, true); }
});

/* =========================================================
   2) MATRIX-RAIN (nur Konfigurator-Oberflaeche)
   ========================================================= */
function startMatrix(){
  const c=document.getElementById("matrix"),x=c.getContext("2d");
  let cols,drops;
  function resize(){c.width=innerWidth;c.height=innerHeight;cols=Math.floor(c.width/14);drops=Array(cols).fill(1);}
  resize();addEventListener("resize",resize);
  const chars="01アイウエオカキABCDEF<>{}/\\".split("");
  setInterval(()=>{
    x.fillStyle="rgba(10,14,20,.08)";x.fillRect(0,0,c.width,c.height);
    x.fillStyle="#00FFAA";x.font="13px monospace";
    for(let i=0;i<drops.length;i++){
      x.fillText(chars[Math.floor(Math.random()*chars.length)],i*14,drops[i]*14);
      if(drops[i]*14>c.height&&Math.random()>.975)drops[i]=0;
      drops[i]++;
    }
  },60);
}

/* =========================================================
   3) KONFIGURATIONS-MODELL
   ========================================================= */
const DEFAULT_CFG = {
  firma:"Mustermann Metallbau",
  slogan:"Ihr Handwerk in besten Händen",
  branche:"Metallbau & Schlosserei",
  logo:"",
  stil:"stahl",
  font:"sans",
  accent:"#ff6a00",
  c1:"#00FFAA",
  c2:"#00B4FF",
  c3:"#8C00FF",
  theme:"dunkel",
  // Seiten-Hintergrundbild (ganze Seite): eigenes Bild ODER Vorlage + Schleier-Staerke
  bg_image:"",        // Data-URI vom Upload (gewinnt vor bg_preset)
  bg_preset:"",       // Schluessel aus BG_PRESETS, "" = keiner
  bg_overlay:72,      // Schleier-Deckkraft in % (Lesbarkeit), 0-95
  // Globaler Karten-Rahmen-Standard: gilt, wo ein Bereich keinen eigenen Wert setzt.
  card_radius:14,     // px, 0 = eckig
  card_border:1,      // px Rahmendicke, 0-4
  card_shadow:1,      // 0 = kein, 1 = weich, 2 = stark
  card_accent:"top",  // Position des farbigen Akzentbalkens: top|left|bottom|none
  card_color:"",      // Rahmenfarbe (einfarbig), "" = Stil-Standard (--line)
  card_fill:"",       // Flächenfarbe der Karten (das "Weiß"), "" = Stil-Standard (--card)
  text_color:"",      // Globale Schriftfarbe (Fließtext), "" = Stil-Standard (--txt)
  head_color:"",      // Globale Überschriftfarbe, "" = Stil-Standard (--txt)
  card_mode:"solid",  // "solid" = einfarbig | "grad" = Mehrfarben-Verlauf

    ${textField("slogan","Slogan / Untertitel")}
    ${textField("branche","Branche (z.B. Malerbetrieb)")}
    <div class="field"><label>Logo (PNG/JPG — optional)</label>
      <input type="file" id="logoFile" accept="image/*">
      <img class="imgprev" id="logoPrev"><div class="hint">Wird in die Website eingebettet (keine externe Datei nötig).</div>
    </div>
  </div></details>

  <details class="sec" open><summary>Design — Stil & Schrift</summary><div class="body">
    <div class="field"><label for="stil">Stil-Vorlage</label>
      <select id="stil">
        ${Object.entries(STILE).map(([k,v])=>`<option value="${k}"${cfg.stil===k?" selected":""}>${v.name}</option>`).join("")}
      </select>
      <div class="hint">Jede Vorlage ist in sich abgestimmt — Farben, Hintergrund und Kontraste passen automatisch.</div>
    </div>
    <div class="field"><label for="font">Schriftart</label>
      <select id="font">
        ${Object.entries(FONTS).map(([k,v])=>`<option value="${k}"${cfg.font===k?" selected":""}>${v.name}</option>`).join("")}
      </select>
    </div>
    <div class="field"><label>Farbverlauf — 3 Farben mischen</label>
      <div id="gradientBar" style="height:26px;border-radius:8px;margin-bottom:10px;border:1px solid var(--line)"></div>
      <div class="row3-color">
        <div><span class="cpl">Farbe 1</span><input type="color" id="c1" value="${cfg.c1}"></div>
        <div><span class="cpl">Farbe 2</span><input type="color" id="c2" value="${cfg.c2}"></div>
        <div><span class="cpl">Farbe 3</span><input type="color" id="c3" value="${cfg.c3}"></div>
      </div>
      <div class="hint" style="margin:10px 0 6px">Schnellauswahl:</div>
      <div class="grad-presets" id="gradPresets"></div>
      <div class="hint">Der Verlauf erscheint in Überschriften, Buttons und Akzenten — wie ein Logo-Schriftzug.</div>
    </div>
  </div></details>

  <details class="sec"><summary>Seiten-Hintergrund</summary><div class="body">
    <div class="field"><label>Eigenes Hintergrundbild (optional)</label>
      <input type="file" id="bgImageFile" accept="image/*">
      <img class="imgprev" id="bgImagePrev">
      <div class="hint">Liegt hinter der ganzen Seite (fixiert). Wird in die Datei eingebettet.</div>
      <button type="button" class="add-btn" id="bgImageClear" style="margin-top:8px">Bild entfernen</button>
    </div>
    <div class="field"><label>Oder eine Vorlage wählen</label>
      <div class="bg-presets" id="bgPresets"></div>
      <div class="hint">Ein eigenes Bild hat Vorrang vor der Vorlage.</div>
    </div>
    <div class="field"><label for="bgOverlay">Lesbarkeits-Schleier: <span id="bgOverlayVal"></span>%</label>
      <input type="range" id="bgOverlay" min="0" max="95" step="1">
      <div class="hint">Dunkler/heller Schleier über dem Bild, damit Text lesbar bleibt. Höher = ruhiger.</div>
    </div>
  </div></details>

  <details class="sec" open><summary>Farben &amp; Rahmen pro Bereich</summary><div class="body">
    <div class="hint" style="margin-bottom:12px">Jeder Abschnitt (Hero, Leistungen, Galerie, Über uns, CTA, Kontakt) kann eigene Farben UND einen eigenen Karten-Stil (Rahmen, Rundung, Schatten, Akzentbalken) bekommen. Leer/„Standard" = Stil-Standard. Klappen Sie pro Bereich „Karten-Stil dieses Bereichs" auf.
      <span id="contrastWarnBox"></span></div>
    <div id="bereicheList"></div>
  </div></details>

  <details class="sec" open><summary>Startbereich (Hero)</summary><div class="body">
    ${textField("hero_eyebrow","Kleiner Obertitel (z.B. Leistungsschlagworte)")}
    <div class="field"><label>Hero-Bild (großes Bild oben rechts — optional)</label>
      <input type="file" id="heroFile" accept="image/*">
      <img class="imgprev" id="heroPrev"><div class="hint">Ihr bestes Referenzfoto. Ohne Bild zeigt die Seite einen dezenten Platzhalter.</div>
    </div>
    <div class="field"><label>Vertrauens-Punkte (3 kurze Stichworte unter dem Hero)</label>
      <div id="trustList"></div>
      <button type="button" class="add-btn" id="addTrust">+ Punkt hinzufügen</button>
    </div>
  </div></details>

  <details class="sec" open><summary>Kontakt</summary><div class="body">
    ${textField("tel","Telefon","tel")}
    ${textField("email","E-Mail","email")}
    ${textField("adresse","Adresse")}
    <div class="field">
      <label for="oeffnungModus">Öffnungszeiten — Darstellung</label>
      <select id="oeffnungModus" aria-label="Darstellung der Öffnungszeiten">
        <option value="text"${cfg.oeffnung_modus!=="tabelle"?" selected":""}>Einfacher Text</option>
        <option value="tabelle"${cfg.oeffnung_modus==="tabelle"?" selected":""}>Wochen-Tabelle + Live-Status</option>
      </select>
      <div class="hint">„Wochen-Tabelle" zeigt auf der Website jeden Tag mit Zeiten und blendet automatisch ein „Jetzt geöffnet / geschlossen"-Schild ein (im Browser des Besuchers berechnet, ohne Server).</div>
    </div>
    <div id="oeffnungTextWrap"${cfg.oeffnung_modus==="tabelle"?' style="display:none"':""}>
      ${textField("oeffnung","Öffnungszeiten (Freitext)")}
    </div>
    <div id="oeffnungTabelleWrap" class="field"${cfg.oeffnung_modus!=="tabelle"?' style="display:none"':""}>
      <label>Öffnungszeiten pro Wochentag</label>
      <div id="oeffnungTage" class="oeff-tage"></div>
      <div class="hint">Häkchen entfernen = an diesem Tag geschlossen. Format der Zeiten: <strong>HH:MM</strong> (z.&nbsp;B. 08:00).</div>
    </div>
    ${textField("domain","Domain (für Anzeige)","text")}
    ${textField("maps_link","Google-Maps-Link (optional)","url")}
    <div class="field"><label><input type="checkbox" id="zeige_kontaktform"${cfg.zeige_kontaktform?" checked":""}> Kontaktformular anzeigen (per E-Mail)</label></div>
  </div></details>

  <details class="sec"><summary>Navigation / Menü-Beschriftungen</summary><div class="body">
    <div class="hint">Hier ändern Sie nur die <strong>Texte</strong> im Menü oben — die Sprungziele bleiben gleich. „Referenzen" erscheint nur, wenn Galerie-Bilder vorhanden sind, „Unsere Firma" nur, wenn die Firmen-Vorstellung gefüllt ist.</div>
    ${textField("nav_home","Startseite-Link (z.B. Home, Start)")}
    ${textField("nav_leistungen","Leistungen-Link")}
    ${textField("nav_galerie","Referenzen-/Galerie-Link")}
    ${textField("nav_ueber","Über-uns-Link")}
    ${textField("nav_kontakt","Kontakt-Link")}
  </div></details>

  <details class="sec"><summary>Über uns</summary><div class="body">
    <div class="field"><label for="ueber_titel">Überschrift</label>
      <input id="ueber_titel" type="text">
      <div class="ci-wrap" style="margin-top:6px"><select id="ueberTitelVorlage" aria-label="Überschrift-Vorlage wählen">
        <option value="">↳ Vorlage einsetzen …</option>
        ${UEBER_TITEL_VORLAGEN.map((t,i)=>`<option value="${i}">${t}</option>`).join("")}
      </select></div>
      <div class="hint">Wählen Sie eine Vorlage oder schreiben Sie eine eigene Überschrift.</div>
    </div>
    <div class="field"><label for="ueber">Beschreibung</label>
      <textarea id="ueber"></textarea>
      <div class="ci-wrap" style="margin-top:6px"><select id="ueberTextVorlage" aria-label="Text-Vorlage wählen">
        <option value="">↳ Vorlage einsetzen …</option>
        ${UEBER_TEXT_VORLAGEN.map((t,i)=>`<option value="${i}">${t.length>60?t.slice(0,60)+"…":t}</option>`).join("")}
      </select></div>
      <div class="hint">Vorlage einsetzen und nach Belieben anpassen.</div>
    </div>
    <div class="field" style="margin-bottom:0"><label>Vorteils-Punkte (mit ✓)</label>
      <div class="ci-wrap" style="margin-bottom:8px"><select id="ueberPunkteVorlage" aria-label="Punkte-Vorlage wählen">
        <option value="">↳ Vorlagen-Set einsetzen …</option>
        ${UEBER_PUNKTE_VORLAGEN.map((s,i)=>`<option value="${i}">${s.name}</option>`).join("")}
      </select></div>
      <div class="hint" style="margin-bottom:8px">Ein Vorlagen-Set ersetzt alle Punkte. Mit ▲ ▼ sortieren, × löschen, einzeln frei bearbeiten.</div>
      <div id="ueberPunkteList"></div>
      <button class="add-btn" id="addUeberPunkt">+ Punkt hinzufügen</button>
    </div>
  </div></details>

  <details class="sec"><summary>Leistungen</summary><div class="body">
    <div class="hint" style="margin-bottom:10px">Mit den Pfeilen ▲ ▼ ändern Sie die Reihenfolge der Karten.</div>
    <div id="leistungenList"></div>
    <button class="add-btn" id="addLeistung">+ Leistung hinzufügen</button>
  </div></details>

  <details class="sec"><summary>Karten-Stil — Standard für alle Bereiche</summary><div class="body">
    <div class="hint">Grund-Einstellung für alle Bereiche. Einzelne Bereiche (Leistungen, Über uns, Galerie …) können davon abweichen — siehe „Farben & Stil pro Bereich".</div>
    <div class="field"><label for="cardRadius">Ecken-Rundung: <span id="cardRadiusVal"></span> px</label>
      <input type="range" id="cardRadius" min="0" max="28" step="1">
      <div class="hint">0 = eckig, höher = runder.</div>
    </div>
    <div class="field"><label for="cardBorder">Rahmen-Dicke: <span id="cardBorderVal"></span> px</label>
      <input type="range" id="cardBorder" min="0" max="4" step="1">
    </div>
    <div class="field"><label for="cardFill">Flächen-Farbe (Kartenhintergrund)</label>
      <div class="ci-wrap"><input type="color" id="cardFill"><button type="button" class="ci-reset" id="cardFillReset" title="Standard">↺</button></div>
      <div class="hint">Die Füllfarbe der Karten/Boxen (das „Weiß"). Standard (↺) = Kartenfarbe des Stils.</div>
    </div>
    <div class="field"><label for="textColor">Schriftfarbe (Fließtext)</label>
      <div class="ci-wrap"><input type="color" id="textColor"><button type="button" class="ci-reset" id="textColorReset" title="Standard">↺</button></div>
      <div class="hint">Farbe des Fließtextes auf der ganzen Seite. Standard (↺) = Textfarbe des Stils.</div>
    </div>
    <div class="field"><label for="headColor">Überschriftfarbe</label>
      <div class="ci-wrap"><input type="color" id="headColor"><button type="button" class="ci-reset" id="headColorReset" title="Standard">↺</button></div>
      <div class="hint">Farbe aller Überschriften (H1–H3). Standard (↺) = wie Fließtext.</div>
    </div>
    <div class="field"><label for="cardMode">Rahmen-Art</label>
      <select id="cardMode">
        <option value="solid">Einfarbig</option>
        <option value="grad">Mehrfarbiger Verlauf</option>
      </select>
    </div>
    <div class="field" id="cardColorField"><label for="cardColor">Rahmen-Farbe</label>
      <div class="ci-wrap"><input type="color" id="cardColor"><button type="button" class="ci-reset" id="cardColorReset" title="Standard">↺</button></div>
      <div class="hint">Standard (↺) = Linienfarbe des Stils. Eigene Farbe wirkt überall, wo kein Bereich etwas anderes vorgibt.</div>
    </div>
    <div class="field" id="cardGradField" style="display:none">
      <label>Verlauf-Farben (2–4, leere werden ignoriert)</label>
      <div id="cardGradBar" style="height:24px;border-radius:8px;margin:4px 0 8px;border:1px solid var(--line)"></div>
      <div class="grad4">
        <input type="color" id="cardGrad0" aria-label="Verlauf-Farbe 1">
        <input type="color" id="cardGrad1" aria-label="Verlauf-Farbe 2">
        <input type="color" id="cardGrad2" aria-label="Verlauf-Farbe 3">
        <span class="g4-wrap"><input type="color" id="cardGrad3" aria-label="Verlauf-Farbe 4"><button type="button" class="ci-reset" id="cardGrad3Clear" title="4. Farbe leeren">×</button></span>
      </div>
      <label for="cardAngle" style="margin-top:8px">Winkel: <span id="cardAngleVal"></span>°</label>
      <input type="range" id="cardAngle" min="0" max="360" step="5">
    </div>
    <div class="field"><label for="cardShadow">Schatten</label>
      <select id="cardShadow">
        <option value="0">Kein Schatten</option>
        <option value="1">Weich</option>
        <option value="2">Stark</option>
      </select>
    </div>
    <div class="field" style="margin-bottom:0"><label for="cardAccent">Farbiger Akzentbalken</label>
      <select id="cardAccent">
        <option value="top">Oben</option>
        <option value="left">Links</option>
        <option value="bottom">Unten</option>
        <option value="none">Aus</option>
      </select>
      <div class="hint">Der dünne Verlaufsbalken, der beim Überfahren der Karte erscheint.</div>
    </div>
  </div></details>

  <details class="sec"><summary>Galerie / Referenzfotos</summary><div class="body">
    <div class="field"><label>Bilder hinzufügen (mehrere möglich)</label>
      <input type="file" id="galerieFile" accept="image/*" multiple></div>
    <div id="galerieList"></div>
    <div class="hint">Tipp: 4–8 Fotos reichen. Sehr viele große Bilder vergrößern die Datei.</div>
  </div></details>

  <details class="sec"><summary>Firmen-Vorstellung (Bild + Text, beliebig viele)</summary><div class="body">
    <div class="field"><label><input type="checkbox" id="zeige_firma"${cfg.zeige_firma?" checked":""}> Firmen-Vorstellung auf der Website anzeigen</label></div>
    ${textField("firma_titel","Überschrift des Bereichs")}
    ${areaField("firma_intro","Einleitungstext (optional)")}
    <div class="hint" style="margin-bottom:10px">Stellen Sie Ihre Firma mit beliebig vielen Bild-und-Text-Blöcken vor — z.&nbsp;B. Team, Werkstatt, Geschichte, Maschinen. Jeder Block hat ein Bild, eine Überschrift und einen Text. Die Bilder liegen offline in der Datei.</div>
    <div id="firmaList"></div>
    <button class="add-btn" id="addFirmaBlock">+ Bild-Text-Block hinzufügen</button>
  </div></details>

  <details class="sec"><summary>Kundenstimmen / Bewertungen</summary><div class="body">
    <div class="field"><label><input type="checkbox" id="zeige_bewertungen"${cfg.zeige_bewertungen?" checked":""}> Bewertungs-Bereich auf der Website anzeigen</label></div>
    <div class="hint" style="margin-bottom:10px">Tragen Sie echte Kundenstimmen selbst ein (Zitat, Name, Ort, Sterne). Vollständig offline — keine Google-Anbindung, kein Tracking, DSGVO-konform. Holen Sie sich vorher das Einverständnis der genannten Personen.</div>
    <div id="bewertungenList"></div>
    <button class="add-btn" id="addBewertung">+ Bewertung hinzufügen</button>
  </div></details>

  <details class="sec"><summary>Rechtstexte (Impressum & Datenschutz)</summary><div class="body">
    ${textField("impressum_name","Verantwortliche Person")}
    ${textField("impressum_firma","Firmenbezeichnung")}
    ${areaField("impressum_adresse","Anschrift (mehrzeilig)")}
    ${textField("impressum_tel","Telefon (Impressum)","tel")}
    ${textField("impressum_email","E-Mail (Impressum)","email")}
    ${textField("impressum_ustid","USt-IdNr. (falls vorhanden)")}
    ${areaField("datenschutz_verantwortlich","Datenschutz — Verantwortlicher")}
    <div class="disclaimer">⚠ Rechtshinweis: Diese Vorlagen sind ein unverbindliches Muster und ersetzen keine
      Rechtsberatung. Sie als Betreiber sind selbst für korrekte und vollständige Rechtstexte verantwortlich.</div>
  </div></details>

  <details class="sec"><summary>SEO (Suchmaschinen)</summary><div class="body">
    ${textField("seo_title","Seitentitel (Title-Tag)")}
    ${areaField("seo_desc","Beschreibung (Meta-Description)")}
    ${textField("seo_keywords","Schlagwörter (Komma-getrennt)")}
    <div class="hint">Automatisch wird ein LocalBusiness-Schema für Google erzeugt — hilft beim Gefundenwerden.</div>
  </div></details>
  `;

  // 3-Farben-Verlauf: Picker, Vorschaubalken, Presets
  function gradCss(){ return `linear-gradient(90deg,${cfg.c1},${cfg.c2},${cfg.c3})`; }
  function updateGradBar(){ const b=document.getElementById("gradientBar"); if(b) b.style.background=gradCss(); }
  function syncPickers(){ ["c1","c2","c3"].forEach(k=>{const el=document.getElementById(k);if(el)el.value=cfg[k];}); }
  ["c1","c2","c3"].forEach(k=>{
    const el=document.getElementById(k);
    if(el) el.addEventListener("input",()=>{ cfg[k]=el.value; cfg.accent=cfg.c1; updateGradBar(); onChange(); });
  });
  const gp=document.getElementById("gradPresets");
  if(gp){ GRADIENT_PRESETS.forEach(p=>{
    const b=document.createElement("button"); b.type="button"; b.textContent=p.name;
    b.style.background=`linear-gradient(90deg,${p.c[0]},${p.c[1]},${p.c[2]})`;
    b.onclick=()=>{ cfg.c1=p.c[0];cfg.c2=p.c[1];cfg.c3=p.c[2];cfg.accent=p.c[0]; syncPickers(); updateGradBar(); onChange(); };
    gp.appendChild(b);
  }); }
  updateGradBar();

  // ── Seiten-Hintergrund: eigenes Bild, Vorlagen, Schleier ─────────
  if(cfg.bg_image){ const p=document.getElementById("bgImagePrev"); p.src=cfg.bg_image; p.style.display="block"; }
  document.getElementById("bgImageFile").addEventListener("change",e=>readImage(e,d=>{
    cfg.bg_image=d; cfg.bg_preset=""; renderBgPresets();
    const p=document.getElementById("bgImagePrev"); p.src=d; p.style.display="block"; onChange();
  }));
  document.getElementById("bgImageClear").onclick=()=>{
    cfg.bg_image=""; const p=document.getElementById("bgImagePrev"); p.src=""; p.style.display="none";
    const f=document.getElementById("bgImageFile"); if(f) f.value=""; renderBgPresets(); onChange();
  };
  function renderBgPresets(){
    const box=document.getElementById("bgPresets"); if(!box) return; box.innerHTML="";
    const none=document.createElement("button"); none.type="button"; none.className="bg-prev"+(!cfg.bg_preset&&!cfg.bg_image?" active":"");
    none.textContent="Kein"; none.title="Stil-Hintergrund verwenden";
    none.onclick=()=>{ cfg.bg_preset=""; renderBgPresets(); onChange(); };
    box.appendChild(none);
    Object.entries(BG_PRESETS).forEach(([k,p])=>{
      const b=document.createElement("button"); b.type="button";
      b.className="bg-prev"+(cfg.bg_preset===k&&!cfg.bg_image?" active":"");
      b.style.background=p.css; if(p.size) b.style.backgroundSize=p.size;
      b.title=p.name; b.setAttribute("aria-label","Hintergrund "+p.name);
      b.onclick=()=>{ cfg.bg_preset=k; cfg.bg_image=""; const pr=document.getElementById("bgImagePrev"); if(pr){pr.src="";pr.style.display="none";}
        const f=document.getElementById("bgImageFile"); if(f)f.value=""; renderBgPresets(); onChange(); };
      const cap=document.createElement("span"); cap.textContent=p.name; b.appendChild(cap);
      box.appendChild(b);
    });
  }
  renderBgPresets();
  (function(){ const r=document.getElementById("bgOverlay"),v=document.getElementById("bgOverlayVal");
    if(r){ r.value=cfg.bg_overlay; if(v)v.textContent=cfg.bg_overlay;
      r.addEventListener("input",()=>{ cfg.bg_overlay=parseInt(r.value,10); if(v)v.textContent=r.value; onChange(); }); } })();

  // ── Farben pro Bereich ───────────────────────────────────────────
  renderBereiche();

  // Bind simple text/area/select/checkbox
  ["firma","slogan","branche","tel","email","adresse","oeffnung","domain","maps_link",
   "firma_titel","firma_intro",
   "nav_home","nav_leistungen","nav_galerie","nav_ueber","nav_kontakt",
   "hero_eyebrow","ueber","ueber_titel","impressum_name","impressum_firma","impressum_adresse","impressum_tel",
   "impressum_email","impressum_ustid","datenschutz_verantwortlich",
   "seo_title","seo_desc","seo_keywords"].forEach(k=>{
    const el=document.getElementById(k);
    if(el){ el.value=cfg[k]||""; el.addEventListener("input",()=>{ cfg[k]=el.value; onChange(); }); }
  });
  bindEl("font","change",el=>{cfg.font=el.value;});
  bindEl("stil","change",el=>{cfg.stil=el.value; renderBereiche();});
  bindEl("zeige_kontaktform","change",el=>{cfg.zeige_kontaktform=el.checked;});

  // Über uns: Vorlagen für Überschrift, Text und Vorteils-Punkte
  const utVor=document.getElementById("ueberTitelVorlage");
  if(utVor) utVor.addEventListener("change",()=>{
    const i=parseInt(utVor.value,10);
    if(!isNaN(i) && UEBER_TITEL_VORLAGEN[i]!=null){ cfg.ueber_titel=UEBER_TITEL_VORLAGEN[i];
      const f=document.getElementById("ueber_titel"); if(f)f.value=cfg.ueber_titel; onChange(); }
    utVor.value="";
  });
  const uxVor=document.getElementById("ueberTextVorlage");
  if(uxVor) uxVor.addEventListener("change",()=>{
    const i=parseInt(uxVor.value,10);
    if(!isNaN(i) && UEBER_TEXT_VORLAGEN[i]!=null){ cfg.ueber=UEBER_TEXT_VORLAGEN[i];
      const f=document.getElementById("ueber"); if(f)f.value=cfg.ueber; onChange(); }
    uxVor.value="";
  });
  const upVor=document.getElementById("ueberPunkteVorlage");
  if(upVor) upVor.addEventListener("change",()=>{
    const i=parseInt(upVor.value,10);
    if(!isNaN(i) && UEBER_PUNKTE_VORLAGEN[i]){ cfg.ueber_punkte=UEBER_PUNKTE_VORLAGEN[i].punkte.slice();
      renderUeberPunkte(); onChange(); }
    upVor.value="";
  });
  renderUeberPunkte();
  const addUp=document.getElementById("addUeberPunkt");
  if(addUp) addUp.onclick=()=>{ if(!Array.isArray(cfg.ueber_punkte)) cfg.ueber_punkte=[];
    cfg.ueber_punkte.push(""); renderUeberPunkte(); onChange(); };

  // Logo
  if(cfg.logo){ const lp=document.getElementById("logoPrev"); lp.src=cfg.logo; lp.style.display="block"; }
  document.getElementById("logoFile").addEventListener("change",e=>readImage(e,d=>{
    cfg.logo=d; const lp=document.getElementById("logoPrev"); lp.src=d; lp.style.display="block"; onChange();
  }));

  // Hero-Bild
  if(cfg.hero_bild){ const hp=document.getElementById("heroPrev"); hp.src=cfg.hero_bild; hp.style.display="block"; }
  document.getElementById("heroFile").addEventListener("change",e=>readImage(e,d=>{
    cfg.hero_bild=d; const hp=document.getElementById("heroPrev"); hp.src=d; hp.style.display="block"; onChange();
  }));

  // Trust-Badges
  renderTrust();
  document.getElementById("addTrust").onclick=()=>{ cfg.trust.push({gross:"Neu",klein:""}); renderTrust(); onChange(); };

  // Öffnungszeiten: Modus-Umschalter (Freitext / Wochen-Tabelle) + Tages-Tabelle
  renderOeffnung();
  const oeffModus=document.getElementById("oeffnungModus");

// ── WCAG-Kontrast-Helfer ─────────────────────────────────────────
function hexToRgb(h){ h=(h||"").replace("#",""); if(h.length===3)h=h.split("").map(x=>x+x).join("");
  const n=parseInt(h,16); if(isNaN(n)||h.length!==6)return null; return {r:(n>>16)&255,g:(n>>8)&255,b:n&255}; }
function relLum(rgb){ const f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4);};
  return .2126*f(rgb.r)+.7152*f(rgb.g)+.0722*f(rgb.b); }
function contrastRatio(fg,bg){ const a=hexToRgb(fg),b=hexToRgb(bg); if(!a||!b)return null;
  const l1=relLum(a),l2=relLum(b); return (Math.max(l1,l2)+.05)/(Math.min(l1,l2)+.05); }

const BEREICH_LABELS = {
  hero:"Startbereich (Hero)", leistungen:"Leistungen", galerie:"Galerie",
  ueber:"Über uns", cta:"Aufruf-Banner (CTA)", kontakt:"Kontakt"

function renderBereiche(){
  const root=document.getElementById("bereicheList"); if(!root) return; root.innerHTML="";

        <div><span class="cpl">Überschrift</span>

          <div><span class="cpl">Ecken-Rundung</span><select data-cf="cr">${radiusOpts}</select></div>

            <option value="">Standard</option><option value="0">Kein</option><option value="1">Weich</option><option value="2">Stark</option></select></div>
          <div><span class="cpl">Akzentbalken</span><select data-cf="ca">
            <option value="">Standard</option><option value="top">Oben</option><option value="left">Links</option><option value="bottom">Unten</option><option value="none">Aus</option></select></div>
          <div><span class="cpl">Rahmen-Art</span><select data-cm="1">
            <option value="">Standard</option><option value="solid">Einfarbig</option><option value="grad">Verlauf</option></select></div>
          <div data-cc-cell><span class="cpl">Rahmen-Farbe</span>
            <div class="ci-wrap"><input type="color" data-cc="1"><button type="button" class="ci-reset" data-ccr="1" title="Standard">↺</button></div></div>
          <div data-cfill-cell><span class="cpl">Flächen-Farbe</span>
            <div class="ci-wrap"><input type="color" data-cfill="1"><button type="button" class="ci-reset" data-cfillr="1" title="Standard">↺</button></div></div>
        </div>
        <div data-grad-cell style="display:none;margin-top:8px">
          <span class="cpl">Verlauf-Farben (2–4) + Winkel</span>
          <div class="grad4" style="margin-top:4px">
            <input type="color" data-cg="0" aria-label="Verlauf-Farbe 1">
            <input type="color" data-cg="1" aria-label="Verlauf-Farbe 2">
            <input type="color" data-cg="2" aria-label="Verlauf-Farbe 3">
            <span class="g4-wrap"><input type="color" data-cg="3" aria-label="Verlauf-Farbe 4"><button type="button" class="ci-reset" data-cgclr="1" title="4. Farbe leeren">×</button></span>
          </div>
          <input type="range" data-cga="1" min="0" max="360" step="5" style="margin-top:6px" aria-label="Verlauf-Winkel">
        </div>
      </details>
      <div class="bereich-warn" data-warn></div>`;
    const setDefaults=()=>{
      d.querySelectorAll("input[type=color][data-f]").forEach(inp=>{

        inp.value = b[f] || (f==="bg"?S.bg:(f==="head"?S.txt:S.txt));
      });
    };
    setDefaults();
    d.querySelectorAll("input[type=color][data-f]").forEach(inp=>{
      inp.addEventListener("input",()=>{ b[inp.dataset.f]=inp.value; updateBereichWarn(d,b,key); onChange(); });
    });

      btn.onclick=()=>{ b[btn.dataset.r]=""; setDefaults(); updateBereichWarn(d,b,key); onChange(); };

    if(ccBtn){ ccBtn.onclick=()=>{ b.cc=""; if(ccInp)ccInp.value=ccDefault; onChange(); }; }
    // Flächen-Farbe pro Bereich (b.cf): "" = globalen Standard / Stil-Standard erben.
    const cfInp=d.querySelector("input[data-cfill]"), cfBtn=d.querySelector(".ci-reset[data-cfillr]");
    const cfDefault = cfg.card_fill || S.card;
    if(cfInp){ cfInp.value = b.cf || cfDefault;
      cfInp.addEventListener("input",()=>{ b.cf=cfInp.value; onChange(); }); }
    if(cfBtn){ cfBtn.onclick=()=>{ b.cf=""; if(cfInp)cfInp.value=cfDefault; onChange(); }; }

    d.querySelectorAll("select[data-cf]").forEach(sel=>{

    const cmSel=d.querySelector("select[data-cm]");
    const ccCell=d.querySelector("[data-cc-cell]"), gradCell=d.querySelector("[data-grad-cell]");
    if(!Array.isArray(b.cg)) b.cg=null;
    const syncBer=()=>{ const m=(b.cm==="grad"||b.cm==="solid")?b.cm:(cfg.card_mode||"solid");
      // Bei Verlauf: Verlauf-Felder zeigen, einzelne Rahmen-Farbe ausblenden.
      if(gradCell)gradCell.style.display = (m==="grad")?"":"none";
      if(ccCell)ccCell.style.display = (m==="grad")?"none":""; };
    if(cmSel){ cmSel.value=(b.cm==null||b.cm==="")?"":b.cm; syncBer();

      inp.addEventListener("input",()=>{ if(!Array.isArray(b.cg)) b.cg=gradDefaults.slice(); b.cg[i]=inp.value; onChange(); });
    });
    const cgClr=d.querySelector(".ci-reset[data-cgclr]");

    const cgaInp=d.querySelector("input[data-cga]");
    if(cgaInp){ cgaInp.value = (b.cgA==null) ? (cfg.card_angle==null?135:cfg.card_angle) : b.cgA;
      cgaInp.addEventListener("input",()=>{ b.cgA=parseInt(cgaInp.value,10); onChange(); }); }
    updateBereichWarn(d,b,key);
    root.appendChild(d);
  });
}

function updateBereichWarn(card,b,key){
  const S=STILE[cfg.stil]||STILE.stahl;
  const bg = b.bg || S.bg;
  const head = b.head || S.txt;
  const text = b.text || S.txt;
  const warns=[];
  const cH=contrastRatio(head,bg), cT=contrastRatio(text,bg);
  if(cH!==null && cH<3)   warns.push("Überschrift kaum lesbar");
  else if(cH!==null && cH<4.5) warns.push("Überschrift schwacher Kontrast");
  if(cT!==null && cT<4.5) warns.push("Text schwacher Kontrast (WCAG AA: 4,5:1)");
  const el=card.querySelector("[data-warn]"); if(!el)return;
  if(warns.length){ el.textContent="⚠ "+warns.join(" · "); el.style.display="block"; }
  else { el.textContent=""; el.style.display="none"; }
}

function renderPreview(){
  const frame=document.getElementById("previewFrame");
  // Scroll-Position der Vorschau merken, damit sie beim Neu-Aufbau nicht nach oben springt
  let prevScroll=0;
  try{ const w=frame.contentWindow; if(w) prevScroll=w.scrollY||w.pageYOffset||0; }catch(e){}
  const restore=()=>{ try{ const w=frame.contentWindow; if(w&&prevScroll) w.scrollTo(0,prevScroll); }catch(e){} };
  frame.addEventListener("load",restore,{once:true});
  frame.srcdoc = generateSiteHTML(cfg, /*forExport*/false);
}
