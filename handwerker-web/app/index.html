function wireTopbar(){
  document.getElementById("btnSaveCfg").onclick=()=>{
    download("GZ-Handwerker-Web-Konfiguration.json", JSON.stringify(cfg,null,2), "application/json");
    toast("Konfiguration gespeichert");
  };
  document.getElementById("btnLoadCfg").onclick=()=>document.getElementById("fileLoadCfg").click();
  document.getElementById("fileLoadCfg").addEventListener("change",e=>{
    const f=e.target.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{cfg=Object.assign(structuredClone(DEFAULT_CFG),JSON.parse(r.result));
      buildConfigUI();renderPreview();toast("Konfiguration geladen");}catch(err){toast("Fehler beim Laden");}};
    r.readAsText(f);e.target.value="";
  });
  document.getElementById("btnExport").onclick=()=>{
    const html=generateSiteHTML(cfg,true);
    const fname=(cfg.domain||"website").replace(/[^a-z0-9]+/gi,"-").replace(/^-|-$/g,"")+".html";
    download(fname||"website.html", html, "text/html");
    toast("Website exportiert — Datei beim Hoster hochladen");
  };
  document.getElementById("btnLicReset").onclick=()=>{
    if(!confirm("Aktuelle Lizenz wirklich abmelden? Sie können danach einen anderen Schlüssel eingeben.")) return;
    localStorage.removeItem(LS_LICENSE);
    location.reload();
  };
}

function download(filename, content, mime){
  const blob=new Blob([content],{type:mime+";charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download=filename;a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),2600);}

/* =========================================================
   7) WEBSITE-GENERATOR — dezent-serioese Handwerker-Seite
   =========================================================
   Erzeugt komplettes Standalone-HTML. forExport=true entfernt nichts
   Konfigurator-spezifisches (die Site ist ohnehin eigenstaendig). */
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function nl2br(s){return esc(s).replace(/\n/g,"<br>");}

function generateSiteHTML(c, forExport){
  const isHex = (v)=> typeof v==="string" && /^#[0-9a-fA-F]{3,8}$/.test(v);
  const S = STILE[c.stil] || STILE.stahl;
  const fontDef = FONTS[c.font] || FONTS.sans;
  const fontStack = fontDef.stack;
  const fontHead = fontDef.head || fontDef.stack; // Schrift-Paar: eigene Überschrift, sonst = Text
  const c1 = c.c1 || S.accentDefault;
  const c2 = c.c2 || c1;
  const c3 = c.c3 || c2;
  const accent = c1; // Hauptakzent (Rahmen, Schatten, Fokus) = erste Verlauffarbe
  const grad = `linear-gradient(90deg,${c1},${c2},${c3})`;
  const gradDiag = `linear-gradient(135deg,${c1},${c2},${c3})`;
  const { bg, bg2, card, line } = S;
  // Globale Schriftfarben: Override > Stil-Standard.
  const txt = isHex(c.text_color) ? c.text_color : S.txt;
  const muted = S.muted;
  const headCol = isHex(c.head_color) ? c.head_color : txt; // Überschriften: eigene Farbe, sonst = Fließtext
  const dark = S.dark;
  const accentInk = "#ffffff"; // Buttons tragen Verlauf -> heller Text, immer gut lesbar
  const shadow = dark ? "0 10px 40px rgba(0,0,0,.45)" : "0 10px 36px rgba(20,30,45,.12)";
  const shadowSm = dark ? "0 4px 18px rgba(0,0,0,.35)" : "0 4px 16px rgba(20,30,45,.08)";

  // ── Karten-Stil: globaler Standard + Pro-Bereich-Overrides ──────────
  // Globale Defaults (Fallback, wenn ein Bereich keinen eigenen Wert setzt).
  const gRadius = Math.max(0, Math.min(28, c.card_radius==null?14:c.card_radius));
  const gBorder = Math.max(0, Math.min(4, c.card_border==null?1:c.card_border));
  const gShadow = c.card_shadow==null?1:c.card_shadow;
  const gColor = c.card_color || "";  // "" = Stil-Standard (--line)
  const gFill = c.card_fill || "";    // "" = Stil-Standard (--card)
  const gAccent = ["top","left","bottom","none"].includes(c.card_accent) ? c.card_accent : "top";
  const gMode = (c.card_mode==="grad") ? "grad" : "solid";
  const gGrad = Array.isArray(c.card_grad) ? c.card_grad : [];
  const gAngle = (typeof c.card_angle==="number") ? c.card_angle : 135;
  // Verlauf-CSS aus bis zu 4 Farben; mind. 2 gueltige Farben noetig, sonst null.
  function gradFromColors(cols, angle){
    const valid = (cols||[]).filter(isHex);
    if(valid.length < 2) return null;
    const a = (typeof angle==="number" && isFinite(angle)) ? Math.round(((angle%360)+360)%360) : 135;
    return `linear-gradient(${a}deg,${valid.join(",")})`;
  }

  // Effektive Karten-Werte fuer einen Bereich: Bereich-Override gewinnt, sonst global.
  function cardStyleFor(key){
    const b = (c.bereiche && c.bereiche[key]) || {};
    const radius = Math.max(0, Math.min(28, b.cr==null?gRadius:b.cr));
    const borderW = Math.max(0, Math.min(4, b.cb==null?gBorder:b.cb));
    const shadowLvl = b.cs==null?gShadow:b.cs;
    const shadowVal = shadowLvl===0 ? "none" : (shadowLvl===2 ? shadow : shadowSm);
    const accentPos = ["top","left","bottom","none"].includes(b.ca) ? b.ca : gAccent;
    const rawColor = b.cc || gColor;  // Bereich-Override > global > Stil-Standard
    const borderColor = isHex(rawColor) ? rawColor : "var(--line)";
    const rawFill = b.cf || gFill;    // Flächenfarbe: Bereich-Override > global > Stil-Standard
    const fill = isHex(rawFill) ? rawFill : "var(--card)";
    const fillSet = isHex(rawFill);   // true = eigene Farbe gewählt (nicht Stil-Standard)
    // Modus: Bereich-Override > global. Bei "grad" Verlauf bauen.
    const mode = (b.cm==="grad" || b.cm==="solid") ? b.cm : gMode;
    let borderGrad = null;
    if(mode==="grad"){
      const cols = (b.cg && b.cg.some(isHex)) ? b.cg : gGrad;
      const ang = (b.cgA==null) ? gAngle : b.cgA;
      borderGrad = gradFromColors(cols, ang);  // null falls < 2 Farben -> faellt auf einfarbig zurueck
    }
    return { radius, borderW, shadowVal, accentPos, borderColor, borderGrad, fill, fillSet };
  }
  // Akzentbalken-CSS fuer einen Selektor mit gegebener Position.
  function accentRules(sel, pos){
    if(pos==="none") return "";
    const inset = pos==="top" ? "0 0 auto 0" : pos==="bottom" ? "auto 0 0 0" : pos==="left" ? "0 auto 0 0" : "0 0 auto 0";
    const isSide = pos==="left";
    const sizeRule = isSide ? "width:3px;height:100%" : "height:3px;width:100%";
    const origin = isSide ? "top" : "left";
    const scale = isSide ? "scaleY" : "scaleX";
    return `${sel}{position:relative}` +
      `${sel}::after{content:"";position:absolute;inset:${inset};${sizeRule};background:var(--grad);transform:${scale}(0);transform-origin:${origin};transition:transform var(--t);z-index:2;pointer-events:none}` +
      `${sel}:hover::after{transform:${scale}(1)}`;
  }
  // Box-Styling (Rahmen/Radius/Schatten/Fläche) als Deklarations-String fuer einen Bereich.
  // padLayer = Fuellung der Innenflaeche fuer den Verlauf-Rahmen-Trick (padding-box).
  //   Standard "var(--card)". Fuer Bild-Boxen "transparent" uebergeben.
  // fillMode: "card" = Flaeche faerben (Karten/Boxen) | "image"/"none" = nicht faerben (Bilder),
  //   die Innenflaeche bleibt transparent damit das Bild sichtbar ist.
  function boxDecl(st, shadowFallback, padLayer, fillMode){
    const sh = st.shadowVal==="none" ? (shadowFallback||"none") : st.shadowVal;
    const base = `border-radius:${st.radius}px;box-shadow:${sh}`;
    const fillBox = (fillMode!=="image" && fillMode!=="none");  // Karten/Boxen faerben
    if(st.borderGrad && st.borderW>0){
      // Doppel-Layer: Innenflaeche (padding-box) + Verlauf (border-box). Erhaelt runde Ecken.
      // Wenn eine Flaechenfarbe gewaehlt wurde, ersetzt sie hier die padding-box-Fuellung.
      const pad = (fillBox && st.fillSet) ? st.fill : (padLayer || "var(--card)");
      return `${base};border:${st.borderW}px solid transparent;` +
        `background:linear-gradient(${pad},${pad}) padding-box,${st.borderGrad} border-box`;
    }
    const fillDecl = (fillBox && st.fillSet) ? `;background:${st.fill}` : "";
    return `${base};border:${st.borderW}px solid ${st.borderColor}${fillDecl}`;
  }
  // Pro-Bereich-CSS bauen: jeder Bereich scoped ueber seine Section-ID.
  const sLeist = cardStyleFor("leistungen");
  const sGal   = cardStyleFor("galerie");
  const sHero  = cardStyleFor("hero");
  const sUeber = cardStyleFor("ueber");
  const sCta   = cardStyleFor("cta");
  const sKont  = cardStyleFor("kontakt");
  // Rahmen- + Flächen-Deklaration fuer Inputs (eigene Flächenfarbe oder Stil-Standard var(--card)).
  function inputBorderDecl(st){
    const innerFill = st.fillSet ? st.fill : "var(--card)";
    if(st.borderGrad && st.borderW>0){
      return `border-radius:${st.radius}px;border:${st.borderW}px solid transparent;` +
        `background:linear-gradient(${innerFill},${innerFill}) padding-box,${st.borderGrad} border-box`;
    }
    const fillDecl = st.fillSet ? `;background:${st.fill}` : "";
    return `border-radius:${st.radius}px;border:${st.borderW}px solid ${st.borderColor}${fillDecl}`;
  }
  const ctaGradPad = "linear-gradient(135deg,var(--bg2),var(--card))"; // CTA-Eigenhintergrund als padding-box
  // Rechtstext-Boxen (Impressum/Datenschutz-Modals) tragen den globalen Karten-Stil.
  // Synthetischer Schluessel -> kein Bereichs-Override, rein globale Defaults.
  const sLegal = cardStyleFor("__legal");
  const cardScopedCss =
    // Leistungs-Karten (Hintergrund var(--card))
    `#leistungen .card{${boxDecl(sLeist, undefined, "var(--card)")}}` +
    accentRules("#leistungen .card", sLeist.accentPos) +
    // Galerie-Bilder (Bild deckt Innenflaeche -> transparent, keine Flächenfarbe)
    `#galerie .gal-item{${boxDecl(sGal, undefined, "transparent", "image")}}` +
    accentRules("#galerie .gal-item", sGal.accentPos) +
    // Hero-Bild / Platzhalter (Bild -> keine Flächenfarbe)
    `#top .hero-visual img,#top .hero-ph{${boxDecl(sHero, shadow, "transparent", "image")}}` +
    accentRules("#top .hero-visual", sHero.accentPos) +
    // Ueber-uns-Bild / Platzhalter (Bild -> keine Flächenfarbe)
    `#ueber .split-img,#ueber .split-ph{${boxDecl(sUeber, shadowSm, "transparent", "image")}}` +
    accentRules("#ueber .split-media", sUeber.accentPos) +
    // CTA-Banner (eigener Verlauf-Hintergrund als padding-box bewahren)
    `#cta{${boxDecl(sCta, undefined, ctaGradPad)}}` +
    accentRules("#cta", sCta.accentPos) +
    // Kontakt-Eingabefelder
    `#kontakt .cform input,#kontakt .cform textarea{${inputBorderDecl(sKont)}}` +
    // Rechtstext-Modals (Impressum / Datenschutz) -> globaler Karten-Stil
    `.modal-card{${boxDecl(sLegal, undefined, "var(--card)")}}` +
    accentRules(".modal-card", sLegal.accentPos) +
    // Kundenstimmen-Karten -> globaler Karten-Stil (Flächenfarbe inklusive)
    `.bw-card{${boxDecl(sLegal, shadowSm, "var(--card)")}}` +
    accentRules(".bw-card", sLegal.accentPos) +
    // Firmen-Vorstellung-Bilder -> globaler Karten-Stil (Bild deckt Fläche -> transparent)
    `#firma .firma-img img,#firma .firma-ph{${boxDecl(sLegal, shadowSm, "transparent", "image")}}`;

  // ── Seiten-Hintergrundbild / Vorlage + Lesbarkeits-Schleier ──────
  const bgPreset = (c.bg_preset && BG_PRESETS[c.bg_preset]) ? BG_PRESETS[c.bg_preset] : null;
  let pageBgLayer = "", pageBgSize = "";
  if (c.bg_image) {
    pageBgLayer = `url("${c.bg_image}")`;
    pageBgSize = "cover";
  } else if (bgPreset) {
    pageBgLayer = bgPreset.css;
    pageBgSize = bgPreset.size || "auto";
  }
  const ov = Math.max(0, Math.min(95, c.bg_overlay==null?72:c.bg_overlay)) / 100;
  // Schleierfarbe an Stil angepasst (dunkel -> schwarzer Schleier, hell -> weisser)
  const overlayRgb = dark ? "8,11,16" : "255,255,255";
  const hasPageBg = !!pageBgLayer;

  // ── Pro-Bereich-Farben: baut inline-style mit Override-Variablen ──
  const B = c.bereiche || {};
  function secStyle(key, base){
    const b = B[key] || {};
    const parts = [];
    if (b.bg)   parts.push(`background:${b.bg}`, `--sec-bg:${b.bg}`);
    if (b.head) parts.push(`--sec-head:${b.head}`);
    if (b.text) parts.push(`--sec-text:${b.text};color:${b.text}`);
    const s = parts.join(";");
    return (base ? base + ";" : "") + s;
  }
  function secAttr(key, base){ const s = secStyle(key, base); return s ? ` style="${s}"` : (base?` style="${base}"`:""); }

  const logoHTML = c.logo
    ? `<img src="${c.logo}" alt="${esc(c.firma)} Logo" class="brand-img">`
    : `<span class="brand-mark">${esc(c.firma)}</span>`;

  // Hero-Visual: Upload oder neutraler Platzhalter (KEINE fremden Bilder)
  const heroVisual = c.hero_bild
    ? `<img src="${c.hero_bild}" alt="Referenzarbeit von ${esc(c.firma)}" loading="eager">`
    : `<div class="hero-ph" role="img" aria-label="Platzhalter für Ihr Hero-Bild"><span>Ihr bestes<br>Referenzfoto</span></div>`;

  const trust = (c.trust||[]).map(t=>`
        <div class="trust-item"><strong>${esc(t.gross)}</strong><span>${esc(t.klein)}</span></div>`).join("");

  const leistungen = (c.leistungen||[]).map(l=>`
        <article class="card">
          <div class="ci" aria-hidden="true">${esc((l.titel||"").trim().charAt(0).toUpperCase()||"✓")}</div>
          <h3>${esc(l.titel)}</h3>
          <p>${esc(l.text)}</p>
        </article>`).join("");

  const hasGalerie = !!(c.galerie && c.galerie.length);
  const galerie = hasGalerie
    ? `<section class="section" id="galerie"${secAttr("galerie","padding-top:0")}><div class="wrap">
        <div class="section-head"><p class="eyebrow">Referenzen</p><h2>Ausgewählte Arbeiten</h2>
          <p class="lead">Ein Einblick in das, was unsere Werkstatt verlässt. Klicken Sie ein Bild für die Großansicht.</p></div>
        <div class="gallery">${c.galerie.map((s,i)=>`
          <figure class="gal-item" tabindex="0" role="button" aria-label="Großansicht Bild ${i+1}" data-src="${s}">
            <img src="${s}" alt="Referenzbild ${i+1}" loading="lazy"></figure>`).join("")}</div>
      </div></section>` : "";

  const bewListe = (c.bewertungen||[]).filter(b=>(b.text||"").trim());
  const hasBewertungen = !!(c.zeige_bewertungen && bewListe.length);
  const sterneHtml = (n)=>{ const s=Math.max(0,Math.min(5,parseInt(n,10)||0));
    return `<span class="bw-stars" aria-label="${s} von 5 Sternen">${"★".repeat(s)}<span class="bw-stars-off">${"★".repeat(5-s)}</span></span>`; };
  const bewertungen = hasBewertungen
    ? `<section class="section bewertungen" id="bewertungen"${secAttr("bewertungen","padding-top:0")}><div class="wrap">
        <div class="section-head reveal"><p class="eyebrow">Kundenstimmen</p><h2>Das sagen unsere Kunden</h2></div>
        <div class="bw-grid">${bewListe.map(b=>`
          <figure class="bw-card reveal">
            ${sterneHtml(b.sterne)}
            <blockquote>${esc((b.text||"").trim())}</blockquote>
            <figcaption>${esc(b.name||"")}${b.ort?` <span>· ${esc(b.ort)}</span>`:""}</figcaption>
          </figure>`).join("")}</div>
      </div></section>` : "";

  // ── Firmen-Vorstellung: beliebig viele Bild+Text-Blöcke, abwechselnd L/R ──
  const firmaBloecke = (c.firma_bloecke||[]).filter(b=>(b.titel||"").trim()||(b.text||"").trim()||b.bild);
  const hasFirma = !!(c.zeige_firma && firmaBloecke.length);
  const firma = hasFirma
    ? `<section class="section firma" id="firma"${secAttr("firma","padding-top:0")}><div class="wrap">
        <div class="section-head reveal"><p class="eyebrow">Unsere Firma</p><h2>${esc(c.firma_titel||"Unsere Firma")}</h2>
          ${(c.firma_intro||"").trim()?`<p class="lead">${nl2br(c.firma_intro)}</p>`:""}</div>
        <div class="firma-list">${firmaBloecke.map((b,i)=>`
          <article class="firma-row${i%2?" alt":""} reveal">
            ${b.bild
              ? `<div class="firma-img"><img src="${b.bild}" alt="${esc((b.titel||"Firmen-Bild").trim())}" loading="lazy"></div>`
              : `<div class="firma-img firma-ph" role="img" aria-label="Platzhalter für Bild"><span>Ihr Bild</span></div>`}
            <div class="firma-txt">
              ${(b.titel||"").trim()?`<h3>${esc(b.titel)}</h3>`:""}
              ${(b.text||"").trim()?`<p>${nl2br(b.text)}</p>`:""}
            </div>
          </article>`).join("")}</div>
      </div></section>` : "";

  const kontaktform = c.zeige_kontaktform ? `
          <form class="cform" onsubmit="return sendMail(event)">
            <label>Ihr Name<input type="text" id="cf_name" required></label>
            <label>Ihre E-Mail<input type="email" id="cf_mail" required></label>
            <label>Ihre Nachricht<textarea id="cf_msg" rows="4" required></textarea></label>
            <button type="submit" class="btn btn-primary">Nachricht senden</button>
          </form>` : "";

  const mapsBtn = c.maps_link
    ? `<a class="btn btn-ghost" href="${esc(c.maps_link)}" target="_blank" rel="noopener">Auf Karte anzeigen</a>` : "";

  const telClean = esc(c.tel).replace(/\s/g,'');

  // ── Öffnungszeiten: Freitext ODER strukturierte Wochen-Tabelle + Live-Status ──
  const tageNamen = ["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];
  const validTime = (v)=> typeof v==="string" && /^([01]?\d|2[0-3]):[0-5]\d$/.test(v);
  const oeffTabelle = (c.oeffnung_modus==="tabelle") && Array.isArray(c.oeffnung_tage) && c.oeffnung_tage.length===7;
  let oeffnungHtml, schemaOpening;
  if(oeffTabelle){
    // Tabellenzeilen + maschinenlesbare data-Attribute fuer den Live-Status (JS-frei zur Anzeige, JS nur fuer Schild).
    const rows = c.oeffnung_tage.map((t,i)=>{
      const auf = !!t.auf && validTime(t.von) && validTime(t.bis);
      const txt = auf ? `${esc(t.von)} – ${esc(t.bis)} Uhr` : "Geschlossen";
      const data = auf ? ` data-von="${esc(t.von)}" data-bis="${esc(t.bis)}"` : ` data-zu="1"`;
      return `<tr data-tag="${i}"${data}><th scope="row">${tageNamen[i]}</th><td>${txt}</td></tr>`;
    }).join("");
    oeffnungHtml = `<div class="oeff-block"><strong>Öffnungszeiten</strong>`+
      `<span class="oeff-status" id="oeffStatus" hidden aria-live="polite"></span>`+
      `<table class="oeff-table"><tbody>${rows}</tbody></table></div>`;
    // schema.org openingHoursSpecification
    const map = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
    schemaOpening = c.oeffnung_tage.map((t,i)=>(!!t.auf && validTime(t.von) && validTime(t.bis)) ? {
      "@type":"OpeningHoursSpecification","dayOfWeek":map[i],"opens":t.von,"closes":t.bis
    } : null).filter(Boolean);
  } else {
    oeffnungHtml = `<p><strong>Öffnungszeiten</strong>${esc(c.oeffnung)}</p>`;
    schemaOpening = c.oeffnung;
  }

  const schema = {
    "@context":"https://schema.org","@type":"LocalBusiness",
    "name":c.firma,"description":c.seo_desc,
    "telephone":c.tel,"email":c.email,"address":c.adresse,"openingHours":schemaOpening
  };

  const sendMailScript = c.zeige_kontaktform ? `
    function sendMail(e){e.preventDefault();
      var n=document.getElementById('cf_name').value,m=document.getElementById('cf_mail').value,
          t=document.getElementById('cf_msg').value;
      var sub=encodeURIComponent('Anfrage über Website von '+n);
      var body=encodeURIComponent(t+'\\n\\nAbsender: '+n+' ('+m+')');
      window.location.href='mailto:${esc(c.email)}?subject='+sub+'&body='+body;
      return false;}` : "";

  const gridBg = S.grid ? `
  body::after{content:"";position:fixed;inset:0;z-index:-1;opacity:.035;pointer-events:none;
    background-image:linear-gradient(rgba(255,255,255,.6) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.6) 1px,transparent 1px);
    background-size:44px 44px}` : "";

  const cutLine = S.glow ? `
  .cut-line{height:2px;border:none;margin:0 auto;max-width:1180px;
    background:linear-gradient(90deg,transparent,${accent},transparent);
    box-shadow:0 0 14px ${accent}88;opacity:.8}` :
  `.cut-line{height:1px;border:none;margin:0 auto;max-width:1180px;background:${line}}`;

  return `<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>${esc(c.seo_title||c.firma)}</title>
<meta name="description" content="${esc(c.seo_desc)}">
<meta name="keywords" content="${esc(c.seo_keywords)}">
<meta name="theme-color" content="${bg}">
<meta property="og:title" content="${esc(c.seo_title||c.firma)}">
<meta property="og:description" content="${esc(c.seo_desc)}">
<meta property="og:type" content="website">
<script type="application/ld+json">${JSON.stringify(schema)}<\/script>
<style>
  :root{--accent:${accent};--c1:${c1};--c2:${c2};--c3:${c3};
    --grad:${grad};--grad-diag:${gradDiag};
    --bg:${bg};--bg2:${bg2};--card:${card};--line:${line};
    --txt:${txt};--muted:${muted};--head:${headCol};--ink:${accentInk};--radius:14px;--maxw:1180px;
    --shadow:${shadow};--shadow-sm:${shadowSm};--t:.28s cubic-bezier(.2,.7,.3,1);
    --font:${fontStack};--font-head:${fontHead}}
  .grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block}
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:var(--font);color:var(--txt);background:var(--bg);line-height:1.65;overflow-x:hidden;-webkit-font-smoothing:antialiased}
  ${hasPageBg ? `
  body::before{content:"";position:fixed;inset:0;z-index:-2;
    background-image:${pageBgLayer};background-size:${pageBgSize};background-position:center;
    background-attachment:fixed;background-repeat:${c.bg_image?"no-repeat":"repeat"}}
  body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:rgba(${overlayRgb},${ov.toFixed(2)})}` : `
  body::before{content:"";position:fixed;inset:0;z-index:-2;
    background:radial-gradient(1200px 600px at 80% -10%,${accent}1a,transparent 60%),
    radial-gradient(900px 500px at -10% 110%,${accent}12,transparent 55%),var(--bg)}
  ${gridBg}`}
  img{max-width:100%;display:block}
  a{color:var(--accent);text-decoration:none;transition:color var(--t)}
  a:hover{opacity:.85}
  :focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:4px}
  .wrap,.container{width:100%;max-width:var(--maxw);margin-inline:auto;padding-inline:clamp(18px,4vw,40px)}
  .skip-link{position:absolute;left:-999px;top:0;background:var(--accent);color:var(--ink);padding:12px 20px;font-weight:700;z-index:1000;border-radius:0 0 8px 0}
  .skip-link:focus{left:0}
  h1,h2,h3{line-height:1.15;color:var(--head);font-weight:800;letter-spacing:-.01em;font-family:var(--font-head)}
  h2{font-size:clamp(1.7rem,3.4vw,2.6rem)}
  h3{font-size:1.25rem}
  .lead{color:var(--muted);font-size:clamp(1.02rem,1.6vw,1.2rem)}
  /* Pro-Bereich-Override: greift nur wenn Sektion eine eigene Farbe gesetzt hat */
  [style*="--sec-head"] h1,[style*="--sec-head"] h2,[style*="--sec-head"] h3{color:var(--sec-head)}
  [style*="--sec-head"] .glow{background:none;-webkit-background-clip:initial;background-clip:initial;color:var(--sec-head)}
  [style*="--sec-text"] p,[style*="--sec-text"] .lead,[style*="--sec-text"] li,
  [style*="--sec-text"] .card p,[style*="--sec-text"] .bw-card blockquote,
  [style*="--sec-text"] .bw-card figcaption,[style*="--sec-text"] .bw-card figcaption span,
  [style*="--sec-text"] .cinfo a,[style*="--sec-text"] .oeff-table td,
  [style*="--sec-text"] .trust-item span{color:var(--sec-text)}
  .section{padding-block:clamp(56px,9vw,110px)}
  /* Sprungziele: unter dem Sticky-Header starten, nicht zu tief springen */
  section[id],[id="top"]{scroll-margin-top:84px}
  .section-head{max-width:720px;margin:0 auto clamp(34px,5vw,56px);text-align:center}
  .eyebrow{display:inline-flex;align-items:center;gap:9px;text-transform:uppercase;letter-spacing:.18em;
    font-size:.78rem;font-weight:800;margin-bottom:14px;
    background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .btn{display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:1rem;padding:14px 26px;
    border-radius:10px;border:1px solid transparent;cursor:pointer;font-family:inherit;
    transition:transform var(--t),box-shadow var(--t),filter var(--t),border-color var(--t)}
  .btn-primary{background:var(--grad-diag);color:#fff;box-shadow:0 8px 24px ${c2}55}
  .btn-primary:hover{transform:translateY(-3px);box-shadow:0 14px 34px ${c2}77;filter:brightness(1.08)}
  .btn-ghost{background:transparent;color:var(--txt);border-color:var(--line)}
  .btn-ghost:hover{border-color:var(--c2);background:${c2}14;transform:translateY(-3px)}
  /* Header */
  .site-header{position:sticky;top:0;z-index:100;background:${bg}cc;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .nav{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:74px}
  .brand{display:flex;align-items:center;gap:12px}
  .brand-img{height:44px;width:auto}
  .brand-mark{font-size:1.3rem;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .brand-text{display:flex;flex-direction:column;line-height:1.05}
  .brand-text strong{color:var(--txt);font-size:1.04rem}
  .brand-text span{color:var(--muted);font-size:.7rem;text-transform:uppercase;letter-spacing:.12em}
  .nav-links{display:flex;align-items:center;gap:6px;list-style:none}
  .nav-links a{color:var(--txt);font-weight:600;font-size:.96rem;padding:10px 13px;border-radius:8px}
  .nav-links a:hover{background:var(--card)}
  .navphone{background:var(--accent);color:var(--ink)!important;padding:9px 16px;border-radius:9px;font-weight:700}
  .nav-toggle{display:none;background:transparent;border:1px solid var(--line);border-radius:9px;width:46px;height:44px;cursor:pointer}
  .nav-toggle span,.nav-toggle span::before,.nav-toggle span::after{content:"";display:block;width:22px;height:2px;background:var(--txt);margin-inline:auto;transition:var(--t);position:relative}
  .nav-toggle span::before{position:absolute;top:-7px}.nav-toggle span::after{position:absolute;top:7px}
  /* Hero */
  .hero{position:relative;overflow:hidden}
  .hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(30px,5vw,70px);align-items:center;padding-block:clamp(56px,8vw,100px)}
  .hero h1{font-size:clamp(2.3rem,5.4vw,4rem);margin-bottom:18px}
  .hero h1 .glow{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero .lead{margin-bottom:30px;max-width:540px}
  .hero-actions{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:34px}
  .hero-trust{display:flex;gap:28px;flex-wrap:wrap}
  .trust-item strong{display:block;color:var(--txt);font-size:1.4rem}
  .trust-item span{color:var(--muted);font-size:.85rem}
  .hero-visual{position:relative}
  .hero-visual img,.hero-ph{aspect-ratio:4/5;object-fit:cover;width:100%}
  .hero-ph{display:grid;place-items:center;background:linear-gradient(135deg,${accent}22,var(--bg2));color:var(--muted);text-align:center;font-weight:700;font-size:1.1rem}
  ${cutLine}
  /* Cards */
  .cards{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(265px,1fr))}
  .card{background:var(--card);padding:28px 26px;
    transition:transform var(--t),border-color var(--t),box-shadow var(--t);position:relative;overflow:hidden}
  .card:hover{transform:translateY(-6px)}
  .card .ci{width:54px;height:54px;border-radius:12px;display:grid;place-items:center;background:${accent}1f;color:var(--accent);
    border:1px solid ${accent}44;font-size:1.5rem;font-weight:800;margin-bottom:18px}
  .card h3{margin-bottom:8px}
  .card p{color:var(--muted);font-size:.98rem}
  /* Gallery */
  .gallery{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
  .gal-item{position:relative;overflow:hidden;cursor:pointer;background:var(--bg2);aspect-ratio:4/3}
  .gal-item img{width:100%;height:100%;object-fit:cover;transition:transform .5s ease}
  .gal-item:hover img{transform:scale(1.07)}
  .lightbox{position:fixed;inset:0;z-index:200;display:none;background:rgba(5,7,10,.92);backdrop-filter:blur(6px);place-items:center;padding:24px}
  .lightbox.open{display:grid}
  .lightbox img{max-width:min(92vw,1000px);max-height:86vh;border-radius:10px;box-shadow:var(--shadow)}
  .lightbox-close{position:absolute;top:20px;right:24px;width:52px;height:52px;border-radius:50%;background:var(--card);border:1px solid var(--line);color:var(--txt);font-size:1.5rem;cursor:pointer}
  /* Split */
  .split{display:grid;grid-template-columns:1fr 1fr;gap:clamp(30px,5vw,64px);align-items:center}
  .split-img{width:100%;object-fit:cover;aspect-ratio:4/3}
  .split-ph{background:linear-gradient(135deg,${accent}1a,var(--bg2));aspect-ratio:4/3;display:grid;place-items:center;color:var(--muted);font-weight:700}
  .firma-list{display:grid;gap:clamp(34px,5vw,64px);max-width:1040px;margin:0 auto}
  .firma-row{display:grid;grid-template-columns:1fr 1fr;gap:clamp(26px,4vw,52px);align-items:center}
  .firma-row.alt .firma-img{order:2}
  .firma-img{width:100%}
  .firma-img img{width:100%;display:block;object-fit:cover;aspect-ratio:4/3}
  .firma-ph{aspect-ratio:4/3;display:grid;place-items:center;background:linear-gradient(135deg,${accent}1a,var(--bg2));color:var(--muted);font-weight:700;border-radius:var(--radius)}
  .firma-txt h3{font-size:clamp(1.3rem,2.4vw,1.7rem);margin-bottom:12px}
  .firma-txt p{color:var(--muted);line-height:1.7}
  .feature-list{list-style:none;display:grid;gap:14px;margin-top:22px}
  .feature-list li{display:flex;gap:12px;align-items:flex-start;color:var(--txt)}
  .feature-list li::before{content:"✓";flex:0 0 auto;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-weight:800;background:${accent}1f;color:var(--accent);border:1px solid ${accent}44}
  /* CTA */
  .cta-band{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--bg2),var(--card));padding:clamp(34px,5vw,60px);text-align:center}
  .cta-band h2{margin-bottom:14px}
  .cta-actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:26px}
  /* Contact */
  .contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:40px;max-width:920px;margin:0 auto}
  .cinfo p{margin-bottom:14px;font-size:1rem}
  .cinfo strong{display:block;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}
  .oeff-block{margin-bottom:14px}
  .oeff-status{display:inline-block;margin:6px 0 4px;padding:3px 10px;border-radius:999px;font-size:.74rem;font-weight:700;letter-spacing:.3px}
  .oeff-status.is-open{background:rgba(43,138,62,.16);color:#2fb24d;border:1px solid rgba(43,138,62,.4)}
  .oeff-status.is-closed{background:rgba(201,42,42,.14);color:#e5484d;border:1px solid rgba(201,42,42,.38)}
  .oeff-table{width:100%;border-collapse:collapse;margin-top:6px;font-size:.92rem}
  .oeff-table th,.oeff-table td{text-align:left;padding:5px 0;border-bottom:1px solid var(--line)}
  .oeff-table th{font-weight:600;color:var(--txt);text-transform:none;letter-spacing:0;font-size:.92rem}
  .oeff-table td{text-align:right;color:var(--muted)}
  .oeff-table tr.oeff-heute th,.oeff-table tr.oeff-heute td{color:var(--txt);font-weight:700}
  .cform{display:flex;flex-direction:column;gap:14px}
  .cform label{display:flex;flex-direction:column;font-size:.9rem;font-weight:600;gap:6px}
  .cform input,.cform textarea{padding:12px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--txt);font-size:1rem;font-family:inherit}
  /* Kundenstimmen */
  .bw-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px;max-width:980px;margin:0 auto}
  .bw-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:26px 26px 22px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:12px}
  .bw-stars{color:var(--accent);font-size:1.05rem;letter-spacing:2px;line-height:1}
  .bw-stars-off{color:var(--line)}
  .bw-card blockquote{font-size:1.02rem;line-height:1.6;color:var(--txt);font-style:italic;quotes:"„" "“"}
  .bw-card blockquote::before{content:open-quote}.bw-card blockquote::after{content:close-quote}
  .bw-card figcaption{font-weight:700;color:var(--txt);font-size:.92rem}
  .bw-card figcaption span{font-weight:500;color:var(--muted)}
  /* Footer */
  footer{background:${dark?bg2:'#1d2733'};color:${dark?'#cdd8e3':'#cdd8e3'};padding:54px 0 30px;margin-top:20px}
  footer .fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:30px}
  footer h4{color:#fff;margin-bottom:12px;font-size:1rem}
  footer a{color:#9fb8d0}footer a:hover{color:#fff}
  .footer-bottom{border-top:1px solid rgba(255,255,255,.12);margin-top:30px;padding-top:18px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;color:#7a8b9c;font-size:.82rem}
  /* Modal */
  .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:300;padding:30px;overflow:auto}
  .modal.open{display:block}
  .modal-card{max-width:760px;margin:20px auto;background:var(--card);color:var(--txt);padding:34px}
  .modal-card h2{text-align:left;margin-bottom:18px}
  .modal-card p{margin-bottom:12px}
  .modal-close{float:right;background:none;border:none;font-size:26px;color:var(--muted);cursor:pointer;line-height:1}
  /* Reveal */
  .reveal{opacity:0;transform:translateY(24px);transition:opacity .7s ease,transform .7s ease}
  .reveal.in{opacity:1;transform:none}
  @media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}}
  @media(max-width:860px){.hero-grid,.split,.contact-grid,.firma-row{grid-template-columns:1fr}
    .firma-row.alt .firma-img{order:0}
    .nav-links{display:none}.nav-toggle{display:block}
    .nav-links.open{display:flex;position:absolute;top:74px;left:0;right:0;flex-direction:column;background:${bg};border-bottom:1px solid var(--line);padding:14px}}
  /* Karten-Stil pro Bereich (Eckenradius / Rahmen / Schatten / Akzentbalken) */
  ${cardScopedCss}
</style>
</head>
<body>
<a class="skip-link" href="#main">Zum Inhalt springen</a>

<header class="site-header"><div class="container nav">
  <a class="brand" href="#top" aria-label="Startseite">
    ${logoHTML}
    <span class="brand-text"><strong>${esc(c.firma)}</strong><span>${esc(c.branche)}</span></span>
  </a>
  <nav aria-label="Hauptnavigation"><ul class="nav-links" id="navLinks">
    <li><a href="#top">${esc(c.nav_home||"Home")}</a></li>
    <li><a href="#leistungen">${esc(c.nav_leistungen||"Leistungen")}</a></li>
    ${hasGalerie?`<li><a href="#galerie">${esc(c.nav_galerie||"Referenzen")}</a></li>`:""}
    <li><a href="#ueber">${esc(c.nav_ueber||"Über uns")}</a></li>
    ${hasFirma?`<li><a href="#firma">${esc(c.firma_titel||"Unsere Firma")}</a></li>`:""}
    <li><a href="#kontakt">${esc(c.nav_kontakt||"Kontakt")}</a></li>
    <li><a class="navphone" href="tel:${telClean}">${esc(c.tel)}</a></li>
  </ul></nav>
  <button class="nav-toggle" id="navToggle" aria-label="Menü" aria-expanded="false"><span></span></button>
</div></header>

<main id="main">
<section class="hero" id="top"${secAttr("hero")}><div class="container hero-grid">
  <div class="hero-copy reveal">

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Bildansicht">
  <button class="lightbox-close" id="lbClose" aria-label="Schließen">✕</button>
  <img id="lbImg" src="" alt="">
</div>

<script>
  function openModal(id){document.getElementById('modal-'+id).classList.add('open')}
  function closeModal(id){document.getElementById('modal-'+id).classList.remove('open')}
  // Anker-Links: sanftes Scrollen im Dokument (auch in der Vorschau, kein Fenster-Wechsel)
  (function(){document.addEventListener('click',function(e){
    var a=e.target.closest('a[href^="#"]'); if(!a)return;
    var id=a.getAttribute('href').slice(1); if(!id)return;
    if(id==='top'){ e.preventDefault(); window.scrollTo({top:0,behavior:'smooth'}); return; }
    var el=document.getElementById(id); if(!el)return;
    e.preventDefault(); el.scrollIntoView({behavior:'smooth',block:'start'});
  });})();
  // Mobile-Nav
  (function(){var t=document.getElementById('navToggle'),n=document.getElementById('navLinks');
    if(t)t.addEventListener('click',function(){var o=n.classList.toggle('open');t.setAttribute('aria-expanded',o)});
    if(n)n.addEventListener('click',function(e){if(e.target.tagName==='A')n.classList.remove('open')});})();
  // Lightbox
  (function(){var lb=document.getElementById('lightbox'),im=document.getElementById('lbImg');
    document.querySelectorAll('.gal-item').forEach(function(g){
      function open(){im.src=g.dataset.src;lb.classList.add('open')}
      g.addEventListener('click',open);
      g.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}});});
    function close(){lb.classList.remove('open')}
    document.getElementById('lbClose').addEventListener('click',close);
    lb.addEventListener('click',function(e){if(e.target===lb)close()});
    document.addEventListener('keydown',function(e){if(e.key==='Escape')close()});})();
  // Reveal on scroll
  (function(){var els=document.querySelectorAll('.reveal');
    if(!('IntersectionObserver'in window)){els.forEach(function(e){e.classList.add('in')});return;}
    var io=new IntersectionObserver(function(en){en.forEach(function(x){if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}})},{threshold:.12});
    els.forEach(function(e){io.observe(e)});})();
  // Öffnungszeiten Live-Status (lokal im Browser, kein Server)
  (function(){
    var badge=document.getElementById('oeffStatus'); if(!badge)return;
    var rows=document.querySelectorAll('.oeff-table tr[data-tag]');
    function toMin(s){var p=(s||'').split(':');return (+p[0])*60+(+p[1]);}
    function tick(){
      var now=new Date();
      var tag=(now.getDay()+6)%7; // 0=Montag
      var nm=now.getHours()*60+now.getMinutes();
      var offen=false, naechsteAuf=null;
      rows.forEach(function(r){
        r.classList.remove('oeff-heute');
        if(+r.getAttribute('data-tag')===tag){
          r.classList.add('oeff-heute');
          if(!r.getAttribute('data-zu')){
            var v=toMin(r.getAttribute('data-von')), b=toMin(r.getAttribute('data-bis'));
            if(b>v && nm>=v && nm<b){ offen=true; }
            else if(b>v && nm<v){ naechsteAuf=r.getAttribute('data-von'); }
          }
        }
      });
      badge.hidden=false;
      badge.textContent=offen?'Jetzt geöffnet':(naechsteAuf?('Geschlossen · öffnet heute '+naechsteAuf+' Uhr'):'Geschlossen');
      badge.className='oeff-status '+(offen?'is-open':'is-closed');
    }
    tick(); setInterval(tick,60000);
  })();
  ${sendMailScript}
<\/script>
</body>
</html>`;
}
</script>
